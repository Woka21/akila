name: Build & Release

on:
  push:
    tags: ["v*"]
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Tauri dependencies
        run: |
          brew install create-dmg
          npm install -g @tauri-apps/cli

      - name: Install npm dependencies
        run: npm install
        working-directory: src-tauri/akila-desktop-agent

      - name: Setup Python & install server dependencies (macOS)
        working-directory: src-tauri/akila-desktop-agent
        run: |
          python3 -m venv src-tauri/resources/server/venv
          src-tauri/resources/server/venv/bin/pip install --upgrade pip
          src-tauri/resources/server/venv/bin/pip install -r src-tauri/resources/server/requirements.txt

      - name: Build application
        run: npx tauri build
        working-directory: src-tauri/akila-desktop-agent

      - name: Notarize DMG (if credentials available)
        if: ${{ env.APPLE_ID != '' }}
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$CERTIFICATE" | base64 --decode | openssl smime -inform PEM -out cert.p12 -outform DER -nocdes
          security create-keychain -p "$CERTIFICATE_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CERTIFICATE_PASSWORD" build.keychain
          
          DMG_PATH=$(find src-tauri/akila-desktop-agent/src-tauri/target/release/bundle -name '*.dmg' | head -1)
          
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          
          xcrun stapler staple "$DMG_PATH"

      - name: Create macOS zip + checksum
        run: |
          cd src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/macos
          APP_DIR=$(find . -maxdepth 1 -name '*.app' -type D | head -1)
          if [ -n "$APP_DIR" ]; then
            zip -rq AKILA-Desktop-Agent-macOS.zip "$APP_DIR"
            shasum -a 256 AKILA-Desktop-Agent-macOS.zip > AKILA-Desktop-Agent-macOS.zip.sha256
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akila-macos
          path: |
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/*.dmg
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/macos/AKILA-Desktop-Agent-macOS.zip
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/macos/AKILA-Desktop-Agent-macOS.zip.sha256

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm install
        working-directory: src-tauri/akila-desktop-agent

      - name: Setup Python & install server dependencies (Windows)
        working-directory: src-tauri/akila-desktop-agent
        run: |
          python -m venv src-tauri/resources/server/venv
          src-tauri/resources/server/venv/Scripts/pip install --upgrade pip
          src-tauri/resources/server/venv/Scripts/pip install -r src-tauri/resources/server/requirements.txt

      - name: Build application
        run: npx tauri build
        working-directory: src-tauri/akila-desktop-agent

      - name: Create Windows zip + checksum
        shell: bash
        run: |
          cd src-tauri/akila-desktop-agent/src-tauri/target/release/bundle
          msi_file=$(find . -maxdepth 2 -name '*.msi' | head -1)
          if [ -n "$msi_file" ]; then
            dir_name=$(dirname "$msi_file")
            base_name=$(basename "$msi_file" .msi)
            cd "$dir_name"
            7z a "${base_name}.zip" "$(basename "$msi_file")"
            sha256sum "${base_name}.zip" | awk '{print $1}' > "${base_name}.zip.sha256"
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akila-windows
          path: |
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/*.msi
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/AKILA-Desktop-Agent-Windows.zip
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/AKILA-Desktop-Agent-Windows.zip.sha256

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev pkg-config libwebkit2gtk-4.0-dev libappindicator3-dev || \
          sudo apt-get install -y libgtk-3-dev libssl-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install npm dependencies
        run: npm install
        working-directory: src-tauri/akila-desktop-agent

      - name: Setup Python & install server dependencies (Linux)
        working-directory: src-tauri/akila-desktop-agent
        run: |
          python3 -m venv src-tauri/resources/server/venv
          src-tauri/resources/server/venv/bin/pip install --upgrade pip
          src-tauri/resources/server/venv/bin/pip install -r src-tauri/resources/server/requirements.txt

      - name: Build application
        run: npx tauri build
        working-directory: src-tauri/akila-desktop-agent

      - name: Create Linux checksum
        run: |
          cd src-tauri/akila-desktop-agent/src-tauri/target/release/bundle
          appimage=$(find . -maxdepth 2 -name '*.AppImage' | head -1)
          if [ -n "$appimage" ]; then
            dir_name=$(dirname "$appimage")
            cd "$dir_name"
            shasum -a 256 "$(basename "$appimage")" > "$(basename "$appimage")".sha256
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akila-linux
          path: |
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/*.AppImage.sha256

  release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AKILA v${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/AKILA-Desktop-Agent-macOS.dmg
            dist/AKILA-Desktop-Agent-macOS.zip
            dist/AKILA-Desktop-Agent-macOS.zip.sha256
            dist/AKILA-Desktop-Agent-Windows.msi
            dist/AKILA-Desktop-Agent-Windows.zip
            dist/AKILA-Desktop-Agent-Windows.zip.sha256
            dist/AKILA-Desktop-Agent-Linux.AppImage
            dist/AKILA-Desktop-Agent-Linux.AppImage.sha256
            dist/akila-extension.zip
