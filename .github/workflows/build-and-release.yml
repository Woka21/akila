name: Build & Release

on:
  push:
    tags: ["v*"]
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tauri & bundling dependencies
        run: |
          brew install create-dmg
          npm install -g @tauri-apps/cli

      - name: Install npm dependencies
        run: npm install
        working-directory: src-tauri/akila-desktop-agent

      - name: Setup Python & install server dependencies
        working-directory: src-tauri/akila-desktop-agent
        run: |
          python3 -m venv src-tauri/resources/server/venv
          src-tauri/resources/server/venv/bin/pip install --upgrade pip
          src-tauri/resources/server/venv/bin/pip install -r src-tauri/resources/server/requirements.txt

      - name: Build application
        run: npx tauri build
        working-directory: src-tauri/akila-desktop-agent

      - name: Notarize DMG (if credentials available)
        if: ${{ env.APPLE_ID != '' }}
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$CERTIFICATE" | base64 --decode | openssl smime -inform PEM -out cert.p12 -outform DER -nocdes
          security create-keychain -p "$CERTIFICATE_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CERTIFICATE_PASSWORD" build.keychain
          
          DMG_PATH=$(find src-tauri/akila-desktop-agent/src-tauri/target/release/bundle -name '*.dmg' | head -1)
          
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          
          xcrun stapler staple "$DMG_PATH"

      - name: Create macOS zip + checksum
        working-directory: src-tauri/akila-desktop-agent
        run: |
          # Rename DMG to match install.sh expectations (DMG is in bundle/dmg/)
          bundle_dir="src-tauri/target/release/bundle"
          while IFS= read -r -d '' dmg; do
            dmg_dir=$(dirname "$dmg")
            mv "$dmg" "${dmg_dir}/AKILA-Desktop-Agent-macOS.dmg"
          done < <(find "$bundle_dir" -name "*.dmg" -print0 2>/dev/null)
          # Create zip and checksum from the .app in bundle/macos/
          cd "${bundle_dir}/macos"
          APP_DIR=$(find . -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -n "$APP_DIR" ]; then
            zip -rq AKILA-Desktop-Agent-macOS.zip "$APP_DIR"
            shasum -a 256 AKILA-Desktop-Agent-macOS.zip > AKILA-Desktop-Agent-macOS.zip.sha256
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akila-macos
          path: |
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/AKILA-Desktop-Agent-macOS.dmg
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/macos/**/AKILA-Desktop-Agent-macOS.zip
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/macos/**/AKILA-Desktop-Agent-macOS.zip.sha256
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WiX Toolset (for MSI bundling)
        shell: powershell
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v4.0\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install npm dependencies
        run: npm install
        working-directory: src-tauri/akila-desktop-agent

      - name: Setup Python & install server dependencies (Windows)
        working-directory: src-tauri/akila-desktop-agent
        shell: bash
        run: |
          python -m venv src-tauri/resources/server/venv
          src-tauri/resources/server/venv/Scripts/python.exe -m pip install --upgrade pip
          src-tauri/resources/server/venv/Scripts/python.exe -m pip install -r src-tauri/resources/server/requirements.txt

      - name: Build application
        shell: bash
        run: npx tauri build
        working-directory: src-tauri/akila-desktop-agent

      - name: Create Windows zip + checksum
        shell: bash
        working-directory: src-tauri/akila-desktop-agent
        run: |
          cd src-tauri/target/release/bundle
          msi_file=$(find . -maxdepth 2 -name '*.msi' | head -1)
          if [ -n "$msi_file" ]; then
            dir_name=$(dirname "$msi_file")
            cd "$dir_name"
            # Rename to match install.sh expectations
            mv "$(basename "$msi_file")" "AKILA-Desktop-Agent-Windows.msi"
            7z a "AKILA-Desktop-Agent-Windows.zip" "AKILA-Desktop-Agent-Windows.msi"
            sha256sum "AKILA-Desktop-Agent-Windows.zip" | awk '{print $1}' > "AKILA-Desktop-Agent-Windows.zip.sha256"
            # Also create sha256 for the MSI
            sha256sum "AKILA-Desktop-Agent-Windows.msi" | awk '{print $1}' > "AKILA-Desktop-Agent-Windows.msi.sha256"
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akila-windows
          path: |
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/*.msi
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/*.msi.sha256
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/*.zip.sha256
          if-no-files-found: ignore

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev pkg-config libwebkit2gtk-4.0-dev libappindicator3-dev libfuse2 || \
          sudo apt-get install -y libgtk-3-dev libssl-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install npm dependencies
        run: npm install
        working-directory: src-tauri/akila-desktop-agent

      - name: Setup Python & install server dependencies (Linux)
        working-directory: src-tauri/akila-desktop-agent
        run: |
          python3 -m venv src-tauri/resources/server/venv
          src-tauri/resources/server/venv/bin/pip install --upgrade pip
          src-tauri/resources/server/venv/bin/pip install -r src-tauri/resources/server/requirements.txt

      - name: Build application
        run: npx tauri build
        working-directory: src-tauri/akila-desktop-agent

      - name: Create Linux checksum
        working-directory: src-tauri/akila-desktop-agent
        run: |
          bundle_dir="src-tauri/target/release/bundle"
          if [ -d "$bundle_dir" ]; then
            appimage=$(find "$bundle_dir" -maxdepth 2 -name '*.AppImage' 2>/dev/null | head -1)
            if [ -n "$appimage" ]; then
              dir_name=$(dirname "$appimage")
              base_name=$(basename "$appimage")
              cd "$dir_name"
              # Rename to match install.sh expectations
              mv "$base_name" "AKILA-Desktop-Agent-Linux.AppImage"
              sha256sum "AKILA-Desktop-Agent-Linux.AppImage" | awk '{print $1}' > "AKILA-Desktop-Agent-Linux.AppImage.sha256"
            fi
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akila-linux
          path: |
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/akila-desktop-agent/src-tauri/target/release/bundle/**/*.AppImage.sha256
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: find dist -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.sha256" \) 2>/dev/null || true

      - name: Create extension zip
        working-directory: src-tauri/akila-desktop-agent/src-tauri/resources/extension
        run: |
          zip -r akila-extension.zip .
          cp akila-extension.zip ../../../../../dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AKILA v${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/AKILA-Desktop-Agent-macOS.dmg
            dist/**/AKILA-Desktop-Agent-macOS.zip
            dist/**/AKILA-Desktop-Agent-macOS.zip.sha256
            dist/**/AKILA-Desktop-Agent-Windows.msi
            dist/**/AKILA-Desktop-Agent-Windows.msi.sha256
            dist/**/AKILA-Desktop-Agent-Windows.zip
            dist/**/AKILA-Desktop-Agent-Windows.zip.sha256
            dist/**/AKILA-Desktop-Agent-Linux.AppImage
            dist/**/AKILA-Desktop-Agent-Linux.AppImage.sha256
            dist/**/akila-extension.zip
