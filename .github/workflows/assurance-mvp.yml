name: AKILA Assurance MVP

on:
  push:
    branches:
      - main
      - feat/outbound-assurance-mvp
  pull_request:
    branches:
      - main

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Akila /akila-assurance-mvp/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q

  extension-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check "Akila /akila-assurance-mvp/extension/page-guard.js"
      - run: node --check "Akila /akila-assurance-mvp/extension/bridge.js"
      - run: node --check "Akila /akila-assurance-mvp/extension/background.js"
      - run: node "Akila /akila-assurance-mvp/extension/coverage.test.mjs"
