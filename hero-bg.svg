<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="none">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0e0d"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#heroGrad)"/>

  <!-- Network grid background -->
  <g stroke="#1a365d" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="700"/>
    <line x1="200" y1="0" x2="200" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="400" y1="0" x2="400" y2="700"/>
    <line x1="500" y1="0" x2="500" y2="700"/>
    <line x1="600" y1="0" x2="600" y2="700"/>
    <line x1="700" y1="0" x2="700" y2="700"/>
    <line x1="800" y1="0" x2="800" y2="700"/>
    <line x1="900" y1="0" x2="900" y2="700"/>
    <line x1="1000" y1="0" x2="1000" y2="700"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Data flow nodes and connections -->
  <g stroke="#2a3573" stroke-width="1.5" fill="none">
    <!-- Left side (user) -->
    <path d="M120 580 C220 540, 260 540, 360 500"/>
    <path d="M120 540 C220 500, 260 500, 360 460"/>
    <path d="M120 500 C220 460, 260 460, 360 420"/>

    <!-- Center (AKILA processing) -->
    <rect x="420" y="380" width="120" height="80" rx="12" fill="rgba(2,195,154,0.08)" stroke="#02c39a" stroke-width="2"/>
    <text x="480" y="430" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14" font-weight="600">AKILA</text>

    <!-- Right side (AI provider) -->
    <path d="M540 420 C640 460, 680 460, 780 500"/>
    <path d="M540 380 C640 420, 680 420, 780 460"/>
    <path d="M540 460 C640 500, 680 500, 780 540"/>
  </g>

  <!-- Data particles flowing -->
  <g fill="#02c39a">
    <circle cx="100" cy="560" r="3" opacity="0.6">
      <animate attributeName="cx" values="100;780" dur="6s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="cy" values="560;500" dur="6s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="120" cy="520" r="3" opacity="0.4">
      <animate attributeName="cx" values="120;780" dur="7s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="cy" values="520;460" dur="7s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="140" cy="480" r="3" opacity="0.5">
      <animate attributeName="cx" values="140;780" dur="5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="cy" values="480;500" dur="5s" repeatCount="indefinite" begin="2s"/>
    </circle>
  </g>

  <!-- Restored data particles (return flow) -->
  <g fill="#cadcfc">
    <circle cx="760" cy="420" r="3" opacity="0.5">
      <animate attributeName="cx" values="780;100" dur="6s" repeatCount="indefinite" begin="3.5s"/>
      <animate attributeName="cy" values="420;560" dur="6s" repeatCount="indefinite" begin="3.5s"/>
    </circle>
    <circle cx="740" cy="380" r="3" opacity="0.3">
      <animate attributeName="cx" values="760;120" dur="7s" repeatCount="indefinite" begin="4.5s"/>
      <animate attributeName="cy" values="380;520" dur="7s" repeatCount="indefinite" begin="4.5s"/>
    </circle>
  </g>

  <!-- Ground line -->
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#2a3573" stroke-width="1" opacity="0.2"/>
</svg>
