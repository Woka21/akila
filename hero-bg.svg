  <circle cx="300" cy="130" r="3" fill="#02C39A" filter="url(#glow)" opacity="0.6"/>
  <circle cx="520" cy="160" r="3" fill="#02C39A" filter="url(#glow)" opacity="0.6"/>
  <circle cx="760" cy="180" r="3" fill="#02C39A" filter="url(#glow)" opacity="0.6"/>
