[package]
name = "akila-desktop-agent"
version = "1.0.0"
description = "AKILA Desktop Agent - PII protection for AI services"
repository = "https://github.com/Woka21/akila"
license = "MIT OR Apache-2.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-autostart = "2.0"

[build-dependencies]
tauri-build = { version = "2.0", features = ["codegen"] }
